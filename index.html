<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <title>RandomTour</title>
    
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=aaa0b99deecb0e874dc5f3fadf223b99&libraries=services&autoload=false"></script>
    
    <style>
        #map { width: 100%; height: 100%; }
        .map-container { background-color: #e5e7eb; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800">

    <div class="flex h-screen w-screen overflow-hidden">
        
        <aside class="w-80 bg-white border-r border-slate-200 flex flex-col h-full shrink-0 shadow-sm z-20">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between bg-slate-900 text-white">
                <h1 class="text-lg font-black tracking-wider flex items-center gap-2 select-none">
                    <span class="text-indigo-400 text-xl">✨</span> randomtour
                </h1>
            </div>

            <div class="flex-1 overflow-y-auto p-5 space-y-6">
                <div class="space-y-4">
                    <h2 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider">🗺️ 여행 조건 설정</h2>
                    
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-600 block">📍 출발 지점</label>
                        <input type="text" id="start-location-input"  placeholder="예: 군산시, 전주시" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none font-semibold transition-all">
                    </div>

                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-600 block">🏷️ 여행 스타일 / 카테고리</label>
                        <input type="text" id="category-input" placeholder="예: 바다, 캠핑, 레트로 감성" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-600 block">🚗 반경 및 거리 선택</label>
                        <div class="grid grid-cols-1 gap-2 text-xs">
                            <label class="flex items-center gap-2.5 p-2.5 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100/70 transition-colors">
                                <input type="radio" name="distance-range" value="close" checked class="w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-500">
                                <div>
                                    <p class="font-bold text-slate-700">가까움</p>
                                    <p class="text-[10px] text-slate-400">출발지 기준 10분 ~ 30분 근교</p>
                                </div>
                            </label>
                            <label class="flex items-center gap-2.5 p-2.5 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100/70 transition-colors">
                                <input type="radio" name="distance-range" value="medium" class="w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-500">
                                <div>
                                    <p class="font-bold text-slate-700">중간 거리</p>
                                    <p class="text-[10px] text-slate-400">출발지 기준 1시간 ~ 3시간 소요</p>
                                </div>
                            </label>
                            <label class="flex items-center gap-2.5 p-2.5 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100/70 transition-colors">
                                <input type="radio" name="distance-range" value="far" class="w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-500">
                                <div>
                                    <p class="font-bold text-slate-700">먼 거리</p>
                                    <p class="text-[10px] text-slate-400">3시간 이상 걸리는 국내 전역</p>
                                </div>
                            </label>
                        </div>
                    </div>

                    <button id="smartAiBuildBtn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3 rounded-xl text-xs shadow-md shadow-indigo-100 transition-all transform active:scale-[0.98] mt-2">
                        🚀 맞춤 여행지 매핑 시작
                    </button>
                </div>

                <hr class="border-slate-100">

                <div class="space-y-4">
                    <h2 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider">📅 나의 확정 여행 코스</h2>
                    
<div class="flex gap-2 mb-3">
    <button id="exportPdfBtn" class="flex-1 bg-red-600 text-white py-2 rounded-xl text-xs font-bold">
        PDF 저장
    </button>
    <button id="exportImageBtn" class="flex-1 bg-blue-600 text-white py-2 rounded-xl text-xs font-bold">
        이미지 저장
    </button>
</div>
<div id="saved-list" class="relative pl-4 border-l-2 border-dashed border-slate-200 space-y-4">
                        <p class="text-xs text-slate-400 py-2 pl-2">저장된 코스 지점이 없습니다.</p>
                    </div>
                </div>
            </div>

            <div id="place-detail-container" class="p-4 border-t border-slate-100 bg-slate-50 hidden">
                <div id="place-detail-view" class="text-xs text-slate-600 leading-relaxed mb-3"></div>
                <button id="savePlaceBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-xs transition-colors">
                    ✨ 여행 지점으로 저장
                </button>
            </div>
        </aside>

        <section class="flex-1 h-full relative map-container z-10">
            <div id="map"></div>
            
            <div class="absolute bottom-6 right-6 flex flex-col gap-1.5 z-30">
                <button id="btnZoomIn" class="w-9 h-9 bg-white text-slate-700 rounded-xl shadow-lg border border-slate-200 flex items-center justify-center font-bold hover:bg-slate-50 text-lg transition-colors">+</button>
                <button id="btnZoomOut" class="w-9 h-9 bg-white text-slate-700 rounded-xl shadow-lg border border-slate-200 flex items-center justify-center font-bold hover:bg-slate-50 text-lg transition-colors">-</button>
            </div>

            <div id="roadview-wrapper" class="absolute top-4 left-4 w-80 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden z-30 hidden">
                <div class="px-4 py-2 bg-slate-900 text-white flex justify-between items-center">
                    <span class="text-[10px] font-bold tracking-wide">📍 실시간 로드뷰 미리보기</span>
                    <button id="closeRoadviewBtn" class="text-slate-400 hover:text-white font-bold text-xs p-1">✕</button>
                </div>
                <div id="roadview" style="width: 100%; height: 180px;"></div>
            </div>
        </section>

        <aside class="w-96 bg-white border-l border-slate-200 flex flex-col h-full shrink-0 shadow-sm z-20">
            <div class="flex border-b border-slate-100 text-xs font-bold bg-slate-50 p-2 gap-1 shrink-0">
                <button id="tabAiBtn" class="flex-1 py-2.5 text-center rounded-lg transition-all border text-purple-600 border-purple-200 bg-purple-50 shadow-sm">
                    🤖 AI 추천 풀코스
                </button>
                <button id="tabSearchBtn" class="flex-1 py-2.5 text-center rounded-lg transition-all border text-slate-500 border-transparent hover:bg-slate-100">
                    🔍 직접 검색 / 주변 탐색
                </button>
            </div>
            
            <div class="flex-1 p-5 overflow-y-auto bg-white">
                <div id="tab-ai-content" class="space-y-4">
                    <div id="ai-status-view" class="text-center py-12 text-slate-400 text-xs leading-relaxed border-2 border-dashed border-slate-100 rounded-2xl px-4">
                        왼쪽 패널에서 조건을 지정하고<br><strong class="text-indigo-600">[🚀 맞춤 여행지 매핑 시작]</strong> 버튼을 누르면 원스톱 풀코스 시나리오 가이드가 이곳에 펼쳐집니다.
                    </div>
                    <div id="ai-recommend-items" class="space-y-4 hidden"></div>
                </div>

                <div id="tab-search-content" class="space-y-4 hidden">
                    <div class="flex gap-2">
                        <input type="text" id="keyword" placeholder="직접 찾아보고 싶은 장소 입력" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none">
                        <button id="searchBtn2" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-4 py-2 rounded-xl font-bold transition-all">검색</button>
                    </div>
                    <h2 id="list-title" class="text-xs font-extrabold text-slate-400 uppercase tracking-wider mt-2">🍽️ 탐색 리스트</h2>
                    <div id="nearby-list" class="space-y-3.5 text-xs text-slate-400">
                        지도를 무작위 클릭하거나 위 입력창을 통해 수동 장소 검색을 진행하세요.
                    </div>
                </div>
            </div>
        </aside>

    </div>

    <div id="custom-confirm-modal" class="fixed inset-0 bg-slate-900/60 z-[9999] flex items-center justify-center hidden backdrop-blur-xs">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl border border-slate-100 transform scale-100 transition-all">
            <h3 class="text-sm font-black text-slate-900 mb-1.5 flex items-center gap-1.5">🔍 탐색 반경 대폭 확장</h3>
            <p id="confirm-modal-msg" class="text-xs text-slate-600 leading-relaxed mb-5">설정된 조건 범위 안에서 추천할 수 있는 새로운 장소 세나리오가 더 이상 없습니다. 범위를 더 넓혀 원거리 명소를 스캔해 볼까요?</p>
            <div class="flex gap-2 text-xs font-bold">
                <button id="modal-cancel-btn" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl transition-colors">아니오</button>
                <button id="modal-ok-btn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl shadow-md shadow-indigo-100 transition-colors">예 (먼 곳 추천)</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "https://cdn.jsdelivr.net/npm/@google/generative-ai@0.22.0/+esm";

        var map, ps, rv, rvClient;
        var currentSelectedPlace = null;
        var aiMarkers = [];
        
        var recommendedPlacesHistory = new Set();
        var isForcedFarSearch = false; 

        // 현재 떠있는 풀코스 데이터 보관용 글로벌 데이터셋 생성
        var currentCourseData = {
            "놀곳": { name: "", type: "놀곳", desc: "", address: "" },
            "밥먹을곳": { name: "", type: "밥먹을곳", desc: "", address: "" },
            "보러갈것": { name: "", type: "보러갈것", desc: "", address: "" },
            "잘곳": { name: "", type: "잘곳", desc: "", address: "" }
        };

        kakao.maps.load(function() {
            var container = document.getElementById('map');
            var options = { center: new kakao.maps.LatLng(35.967605, 126.736855), level: 5 };
            map = new kakao.maps.Map(container, options);
            ps = new kakao.maps.services.Places();

            var rvContainer = document.getElementById('roadview');
            rv = new kakao.maps.Roadview(rvContainer);
            rvClient = new kakao.maps.RoadviewClient();

            kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
                var latlng = mouseEvent.latLng;
                triggerRoadview(latlng);
                switchTab('search');
                searchNearby(latlng);
            });

            document.getElementById('searchBtn2').onclick = searchPlaces;
            document.getElementById('btnZoomIn').onclick = function() { map.setLevel(map.getLevel() - 1); };
            document.getElementById('btnZoomOut').onclick = function() { map.setLevel(map.getLevel() + 1); };
            document.getElementById('savePlaceBtn').onclick = savePlace;
            document.getElementById('closeRoadviewBtn').onclick = function() {
                document.getElementById('roadview-wrapper').classList.add('hidden');
            };
            
            document.getElementById('smartAiBuildBtn').onclick = function() {
                recommendedPlacesHistory.clear();
                isForcedFarSearch = false;
                buildSmartAiCourse();
            };
            
            document.getElementById('tabSearchBtn').onclick = () => switchTab('search');
            document.getElementById('tabAiBtn').onclick = () => switchTab('ai');

            renderSavedList();
        });

        function switchTab(target) {
            const tSearchBtn = document.getElementById('tabSearchBtn');
            const tAiBtn = document.getElementById('tabAiBtn');
            const cSearch = document.getElementById('tab-search-content');
            const cAi = document.getElementById('tab-ai-content');

            if (target === 'search') {
                tSearchBtn.className = "flex-1 py-2.5 text-center rounded-lg transition-all border text-blue-600 border-blue-200 bg-blue-50 shadow-sm";
                tAiBtn.className = "flex-1 py-2.5 text-center rounded-lg transition-all border text-slate-500 border-transparent hover:bg-slate-100";
                cSearch.classList.remove('hidden');
                cAi.classList.add('hidden');
            } else {
                tAiBtn.className = "flex-1 py-2.5 text-center rounded-lg transition-all border text-purple-600 border-purple-200 bg-purple-50 shadow-sm";
                tSearchBtn.className = "flex-1 py-2.5 text-center rounded-lg transition-all border text-slate-500 border-transparent hover:bg-slate-100";
                cSearch.classList.add('hidden');
                cAi.classList.remove('hidden');
            }
        }

        function triggerRoadview(latlng) {
            rvClient.getNearestPanoId(latlng, 50, function(panoId) { 
                if (panoId) {
                    document.getElementById('roadview-wrapper').classList.remove('hidden');
                    rv.setPanoId(panoId, latlng); 
                }
            });
        }

        function searchPlaces() {
            var keyword = document.getElementById('keyword').value;
            if (!keyword.trim()) return;
            switchTab('search');
            ps.keywordSearch(keyword, function(data, status) {
                if (status === kakao.maps.services.Status.OK) displayPlaces(data, "🔍 수동 검색 결과");
            });
        }

        function searchNearby(latlng) {
            var listEl = document.getElementById('nearby-list');
            document.getElementById('list-title').innerText = "⏳ 주변 정보 스캔 중...";
            listEl.innerHTML = '<div class="text-center py-4 animate-pulse">주변 장소를 불러오는 중입니다...</div>';

            ps.categorySearch('FD6', function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    displayPlaces(data, "🍽️ 클릭 지점 주변 맛집/추천");
                } else {
                    ps.categorySearch('AT4', function(data2, status2) {
                        if (status2 === kakao.maps.services.Status.OK) {
                            displayPlaces(data2, "📸 클릭 지점 주변 관광 명소");
                        } else {
                            document.getElementById('list-title').innerText = "🍽️ 탐색 결과 없음";
                            listEl.innerHTML = '<div class="text-center py-4 text-slate-400">반경 500m 이내에 상권 정보가 없습니다.</div>';
                        }
                    }, { location: latlng, radius: 500, sort: kakao.maps.services.SortBy.DISTANCE });
                }
            }, { location: latlng, radius: 500, sort: kakao.maps.services.SortBy.DISTANCE });
        }

        function displayPlaces(places, title) {
            document.getElementById('list-title').innerText = title;
            var listEl = document.getElementById('nearby-list');
            listEl.innerHTML = '';

            aiMarkers.forEach(function(item) {
                if (item && typeof item.setMap === 'function') item.setMap(null);
            });
            aiMarkers = [];

            places.forEach(function(place) {
                var itemEl = document.createElement('div');
                itemEl.className = 'p-3 border border-slate-100 bg-slate-50/50 rounded-xl hover:bg-indigo-50/70 hover:border-indigo-100 cursor-pointer text-slate-800 transition-all shadow-xs';
                itemEl.innerHTML = `
                    <div class="flex justify-between items-start">
                        <strong class="text-xs font-bold text-slate-900 group-hover:text-indigo-600">${place.place_name}</strong>
                        <span class="text-[10px] text-indigo-500 font-medium bg-indigo-50 px-1 py-0.5 rounded shrink-0">${(place.distance / 1000).toFixed(1)}km</span>
                    </div>
                    <p class="text-[11px] text-slate-500 mt-1 truncate">${place.address_name}</p>
                `;
                
                itemEl.onclick = function() {
                    var placeLatLng = new kakao.maps.LatLng(place.y, place.x);
                    map.panTo(placeLatLng);
                    currentSelectedPlace = place;
                    
                    document.getElementById('place-detail-container').classList.remove('hidden');
                    document.getElementById('place-detail-view').innerHTML = `
                        <div class="space-y-1">
                            <h3 class="font-extrabold text-indigo-600 text-sm">${place.place_name}</h3>
                            <p class="text-[11px] text-slate-500">주소: ${place.address_name}</p>
                            <p class="text-[11px] text-slate-400">연락처: ${place.phone || '정보 없음'}</p>
                        </div>
                    `;
                    
                    aiMarkers.forEach(function(m) { if(m.setMap) m.setMap(null); });
                    var marker = new kakao.maps.Marker({ map: map, position: placeLatLng });
                    aiMarkers.push(marker);
                    
                    triggerRoadview(placeLatLng);
                };
                listEl.appendChild(itemEl);
            });
        }

        function savePlace() {
            if (!currentSelectedPlace) return;
            var savedPlaces = JSON.parse(localStorage.getItem('myTourPlan') || '[]');
            if (!savedPlaces.some(p => p.id === currentSelectedPlace.id)) {
                savedPlaces.push({ id: currentSelectedPlace.id, name: currentSelectedPlace.place_name, address: currentSelectedPlace.address_name, lat: currentSelectedPlace.y, lng: currentSelectedPlace.x });
                localStorage.setItem('myTourPlan', JSON.stringify(savedPlaces));
                renderSavedList();
                alert('나의 확정 코스에 추가되었습니다.');
            }
        }

        function renderSavedList() {
            var savedPlaces = JSON.parse(localStorage.getItem('myTourPlan') || '[]');
            var listContainer = document.getElementById('saved-list');
            if (savedPlaces.length === 0) {
                listContainer.innerHTML = '<p class="text-xs text-slate-400 py-1">저장된 지점이 없습니다.</p>';
                return;
            }
            listContainer.innerHTML = '';
            savedPlaces.forEach((p, index) => {
                var div = document.createElement('div');
                div.className = 'relative p-3 border border-slate-200 bg-white rounded-xl flex justify-between items-center shadow-xs group';
                
                var bullet = document.createElement('div');
                bullet.className = 'absolute -left-[21px] top-4 w-2.5 h-2.5 rounded-full bg-indigo-600 border-2 border-white';
                div.appendChild(bullet);

                var infoDiv = document.createElement('div');
                infoDiv.className = 'cursor-pointer max-w-[80%]';
                infoDiv.innerHTML = `<div class="font-extrabold text-xs text-slate-900 truncate">${index + 1}. ${p.name}</div><div class="text-[10px] text-slate-400 truncate mt-0.5">${p.address}</div>`;
                infoDiv.onclick = function() {
                    var loc = new kakao.maps.LatLng(p.lat, p.lng);
                    map.panTo(loc);
                    triggerRoadview(loc);
                };
                
                var delBtn = document.createElement('button');
                delBtn.className = 'text-slate-400 hover:text-red-500 text-xs font-semibold px-1 shrink-0 transition-colors';
                delBtn.innerText = '삭제';
                delBtn.onclick = function() {
                    var currentList = JSON.parse(localStorage.getItem('myTourPlan') || '[]');
                    localStorage.setItem('myTourPlan', JSON.stringify(currentList.filter(item => item.id !== p.id)));
                    renderSavedList();
                };
                
                div.appendChild(infoDiv);
                div.appendChild(delBtn);
                listContainer.appendChild(div);
            });
        }

        /* =======================================================
           🚀 AI 풀코스 매핑 엔진 (JSON 통신 데이터 기반)
           ====================================================== */
        async function buildSmartAiCourse() {
            var startLoc = document.getElementById('start-location-input').value.trim() || "군산시";
            var categories = document.getElementById('category-input').value.trim();
            var distanceRadio = document.querySelector('input[name="distance-range"]:checked');
            var distanceRange = distanceRadio ? distanceRadio.value : "close";

            if(!categories) {
                alert("🏷️ 원하는 카테고리를 기입해 주세요!");
                return;
            }

            aiMarkers.forEach(function(item) {
                if (item && typeof item.setMap === 'function') item.setMap(null);
                if (item && typeof item.close === 'function') item.close();
            });
            aiMarkers = [];

            switchTab('ai');
            const statusView = document.getElementById('ai-status-view');
            const itemsContainer = document.getElementById('ai-recommend-items');
            
            statusView.innerHTML = `
                <div class="py-12 text-indigo-600 font-bold flex flex-col items-center justify-center gap-3">
                    <div class="animate-spin w-7 h-7 border-3 border-indigo-600 border-t-transparent rounded-full"></div>
                    <p class="text-xs text-slate-600 font-medium text-center leading-relaxed">초근접 황금 동선을 설계하는 중입니다...<br>장소 간 이동 거리를 압도적으로 단축합니다.</p>
                </div>
            `;
            statusView.classList.remove('hidden');
            itemsContainer.classList.add('hidden');

            let distanceTxt = "";
            if (isForcedFarSearch) {
                distanceTxt = `출발지(${startLoc}) 기준 차로 '3시간 이상 걸리는' 장거리 지역 범위`;
            } else {
                if(distanceRange === "close") distanceTxt = `출발지(${startLoc}) 기준 차로 '10분에서 30분 거리'의 매우 가까운 근교 범위`;

            const originalHTML = parentCard.innerHTML;
            
            parentCard.innerHTML = `
                <div class="py-6 flex flex-col items-center justify-center gap-2">

                </div>
            `;

            var categories = document.getElementById('category-input').value.trim();

            Object.keys(currentCourseData).forEach(key => {
                if (key !== targetType && currentCourseData[key].name) {
                    contextualAnchorText += `- 현재 매핑된 [${key}]: ${currentCourseData[key].name} (위치: ${currentCourseData[key].address})\n`;
                }
            });

            try {
                

                const prompt = `

                    [기존 고정된 주변 장소 문맥 환경]
                    ${contextualAnchorText || "- 출발지 기준: " + startLoc}
                    - 유저 선호 스타일: ${categories}

                    [🚨 리롤 제약 조건]
                    - 오직 [${targetType}] 목적에 맞고, 위의 기존 장소 환경들과 지리적으로 완벽하게 밀착 연쇄(차량 10~20분 혹은 도보 권역)가 이뤄지는 대체 장소를 명확히 1곳 선정하세요.
                    - 블랙리스트 목록: [ ${historyBlacklist || '없음'} ]
                    - 블랙리스트에 걸려서 매핑 조건에 맞는 장소를 더 이상 제공할 수 없거나 찾지 못하겠다면 무조건 다음 6글자 문자열만 반환하세요: NOTFOUND

                    [🚨 JSON 출력 가이드]
                    - 마크다운 기호 없이, JavaScript JSON.parse()가 바로 호환되는 데이터 형태의 단일 오브젝트 객체만 리턴하세요.
                    { "type": "${targetType}", "name": "새로운 추천 장소명", "desc": "추천사유 및 인접 장소와의 연쇄성 피드백", "address": "실제 주소" }
                `;

               const response = await fetch("/api/gemini", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({ prompt })
});

const data = await response.json();

if(!data.success){

}

var aiText = data.text.trim();

                singleAiText = singleAiText.replace(/```json/g, '').replace(/```/g, '').trim();

                // 무한 루프 순환 처리: 더 이상 추천할 곳이 없으면 블랙리스트 히스토리를 초기화하고 과거 추천지가 나오도록 처리
                if (singleAiText.includes("NOTFOUND")) {
                    recommendedPlacesHistory.clear(); 
                    
                    // 현재 눈앞에 있는 4가지 장소 이름은 다시 추가해서 직전 장소가 즉시 똑같이 중복되는 것은 방지
                    Object.keys(currentCourseData).forEach(key => {
                        if (currentCourseData[key].name) recommendedPlacesHistory.add(currentCourseData[key].name);
                    });

                console.error(error);

        /* data-address와 data-name 속성을 직접 가져오도록 안전하게 바인딩 */
        window.focusAiPlace = function(buttonElement) {
            var address = buttonElement.getAttribute('data-address');
            var placeName = buttonElement.getAttribute('data-name');

            if (!address || address.includes("여기에")) {
                alert("위치 정보를 주소형태로 확보하지 못했습니다.");
                return;
            }

            var geocoder = new kakao.maps.services.Geocoder();
            geocoder.addressSearch(address, function(result, status) {
                if (status === kakao.maps.services.Status.OK) {
                    var coords = new kakao.maps.LatLng(result[0].y, result[0].x);
                    
                    aiMarkers.forEach(function(item) {
                        if (item && typeof item.setMap === 'function') item.setMap(null);
                        if (item && typeof item.close === 'function') item.close();
                    });
                    aiMarkers = [];

                    var marker = new kakao.maps.Marker({ map: map, position: coords });
                    aiMarkers.push(marker);

                    var infowindow = new kakao.maps.InfoWindow({
                        content: `<div style="width:150px;text-align:center;padding:5px 0;font-size:11px;font-weight:bold;color:#4f46e5;">${placeName}</div>`
                    });
                    infowindow.open(map, marker);
                    aiMarkers.push(infowindow);

                    map.panTo(coords);
                    triggerRoadview(coords);
                } else {
                    ps.keywordSearch(placeName, function(data, status) {
                        if (status === kakao.maps.services.Status.OK) {
                            var coords = new kakao.maps.LatLng(data[0].y, data[0].x);
                            map.panTo(coords);
                            triggerRoadview(coords);

                            alert("주소 서칭에 실패했습니다.");
                        }
                    });
                }
            });
        };

        window.saveAiPlaceToPlan = function(buttonElement) {
            var address = buttonElement.getAttribute('data-address');
            var placeName = buttonElement.getAttribute('data-name');

            if (!address || address.includes("여기에")) {
                alert("정확한 주소가 기재되어 있지 않아 연동이 제한됩니다.");
                return;
            }

            var geocoder = new kakao.maps.services.Geocoder();
            geocoder.addressSearch(address, function(result, status) {
                var lat = 35.967605;
                var lng = 126.736855;
                if (status === kakao.maps.services.Status.OK) {
                    lat = result[0].y;
                    lng = result[0].x;
                }

                var savedPlaces = JSON.parse(localStorage.getItem('myTourPlan') || '[]');
                if (savedPlaces.some(p => p.name === placeName)) {
                    alert("이미 타임라인에 편성된 장소입니다.");
                    return;
                }

                savedPlaces.push({ id: "smart_" + Date.now(), name: placeName, address: address, lat: lat, lng: lng });
                localStorage.setItem('myTourPlan', JSON.stringify(savedPlaces));
                renderSavedList();
                alert(`✨ [${placeName}] 장소가 확정 코스 목록에 정상 편입되었습니다!`);

window.addEventListener('load', function(){

    async function buildExportCanvas(){
        const savedPlaces = JSON.parse(localStorage.getItem('myTourPlan') || '[]');

        const wrapper = document.createElement('div');
        wrapper.style.width='800px';
        wrapper.style.padding='30px';
        wrapper.style.background='white';
        wrapper.innerHTML = `
            <h1 style="font-size:28px;font-weight:bold;margin-bottom:20px;">
                RandomTour 여행 계획서
            </h1>
            ${savedPlaces.map((p,i)=>`
                <div style="border:1px solid #ddd;padding:12px;margin-bottom:10px;border-radius:10px;">
                    <h3>${i+1}. ${p.name}</h3>
                    <p>${p.address}</p>
                </div>
            `).join('')}
        `;

        document.body.appendChild(wrapper);
        const canvas = await html2canvas(wrapper,{scale:2});
        document.body.removeChild(wrapper);
        return canvas;
    }

    const pdfBtn = document.getElementById('exportPdfBtn');
    if(pdfBtn){
        pdfBtn.onclick = async function(){
            const canvas = await buildExportCanvas();
            const img = canvas.toDataURL('image/png');

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p','mm','a4');

            const width = 190;
            const height = canvas.height * width / canvas.width;

            pdf.addImage(img,'PNG',10,10,width,height);
            pdf.save('RandomTour_TravelPlan.pdf');
        };
    }

    const imageBtn = document.getElementById('exportImageBtn');
    if(imageBtn){
        imageBtn.onclick = async function(){
            const canvas = await buildExportCanvas();
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'RandomTour_TravelPlan.png';
            link.click();
        };
    }
});
